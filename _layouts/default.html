<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <style>
      :root { color-scheme: dark; --bg: #0b1020; --panel: #111a2e; --text: #dbe7f5; --muted: #91a4bd; --accent: #67e8f9; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.75 system-ui, sans-serif; }
      header { border-bottom: 1px solid #22304b; background: #0d1528; }
      nav, main { width: min(900px, calc(100% - 2rem)); margin: auto; }
      nav { padding: 1.25rem 0; }
      nav a { color: var(--accent); text-decoration: none; font-weight: 700; }
      main { padding: 4rem 0 6rem; }
      article { background: var(--panel); border: 1px solid #22304b; border-radius: 14px; padding: clamp(1.25rem, 4vw, 3rem); box-shadow: 0 18px 50px #0004; }
      h1, h2, h3 { color: #f4f8ff; line-height: 1.2; }
      h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin-top: 0; }
      a { color: var(--accent); }
      pre { overflow-x: auto; background: #080d19; padding: 1rem; border-radius: 8px; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      blockquote { border-left: 3px solid var(--accent); margin-left: 0; padding-left: 1rem; color: var(--muted); }
      footer { color: var(--muted); text-align: center; padding: 2rem; }
    </style>
  </head>
  <body>
    <header><nav><a href="{{ '/' | relative_url }}">{{ site.title }}</a></nav></header>
    <main><article>{{ content }}</article></main>
    <footer>© {{ site.time | date: '%Y' }} {{ site.title }}</footer>
  </body>
</html>
